[project]
name = "mean-reversion-live"
version = "0.1.0"
description = "Live Polymarket 15m mean-reversion paper trader (importing decision logic from polymarket-arb)"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "pandas>=2.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mean_reversion_live"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
